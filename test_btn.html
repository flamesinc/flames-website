<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#121212] p-4 flex justify-center items-center min-h-screen">
  <div style="width: 330px;" class="bg-[#1a1412] p-5 rounded-3xl border border-[#F7632D]/40 space-y-4">
    <label class="block text-xs font-bold text-gray-300">Want a Certified On-Site Fuel-Cost Assessment?</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-xs font-bold text-gray-400">+91</span>
      <input type="tel" placeholder="Enter WhatsApp Mobile No." class="w-full bg-[#141414] border border-[#3b3b3b] rounded-xl pl-12 pr-4 py-3 text-sm text-white">
    </div>
    <button id="calc-lead-submit" class="w-full flex items-center justify-center gap-2.5 bg-[#25D366] hover:bg-[#20ba59] text-white font-extrabold px-4 sm:px-6 py-3.5 rounded-xl text-xs sm:text-sm shadow-xl transition-all">
      <i data-lucide="message-circle" class="w-5 h-5 shrink-0"></i>
      <span class="text-center leading-snug">Get Free Assessment on WhatsApp</span>
    </button>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
